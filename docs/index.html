<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Rankings — schedule-adjusted EPA</title>
<meta name="description" content="Free NFL power rankings built from nflverse play-by-play data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=Source+Serif+4:ital,wght@0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e3b2e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="masthead"><div class="wrap">
  <h1>NFL Rankings</h1>
  <p>Schedule-adjusted EPA margin, from free nflverse data.</p>
  <div class="nav"><a href="methodology.html">Methodology</a>
    <a href="https://github.com/nflverse">nflverse</a></div>
</div></header>
<main class="wrap">
  <div class="controls">
    <div><span class="lbl" id="model-lbl" style="display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#5d584b;margin-bottom:3px">Model</span>
      <div class="seg" role="group" aria-labelledby="model-lbl">
        <button type="button" id="m-v2" aria-pressed="true">v2 EPA</button>
        <button type="button" id="m-legacy" aria-pressed="false">Legacy FUNCTION</button>
      </div></div>
    <label>Season <select id="season"></select></label>
    <label>Conference <select id="conf"><option value="">All</option><option>AFC</option><option>NFC</option></select></label>
    <label>Division <select id="div"><option value="">All</option></select></label>
    <label>Search <input id="q" type="search" placeholder="Team name" autocomplete="off"></label>
  </div>
  <div class="fresh" id="fresh" aria-live="polite">Loading…</div>
  <div class="tablewrap" id="tablewrap">
    <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
  <div class="state" id="state" hidden></div>
  <p class="fresh">Click a row to see legacy components and raw EPA. <a href="methodology.html">How this works</a>.</p>
</main>
<footer><div class="wrap">Data: <a href="https://github.com/nflverse">nflverse</a> via nfl_data_py. Free data only.</div></footer>
<script src="assets/app.js"></script>
</body>
</html>
