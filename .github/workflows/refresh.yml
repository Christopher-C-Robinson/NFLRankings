name: refresh
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year or 'latest'"
        required: false
        default: latest
  schedule:
    - cron: "0 14 * * 2"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install --no-deps nfl_data_py==0.3.3
      - name: Build rankings
        env:
          SEASON: ${{ github.event.inputs.season || 'latest' }}
        run: python -m nflrankings --season "$SEASON"
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain docs/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "Refresh NFL rankings"
            git push
          else
            echo "No data changes"
          fi
